name: Release image

# Publishes the production image to GitHub Container Registry:
#   ghcr.io/<owner>/task-management-api:latest   (default branch)
#   ghcr.io/<owner>/task-management-api:sha-<short sha>
#   ghcr.io/<owner>/task-management-api:<version> (tags v*)
# On our own runners only, like CI (see ci.yml): skipped while CI_RUNNER is unset.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: vars.CI_RUNNER != ''
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/task-management-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
