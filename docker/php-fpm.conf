; Loaded after the image's own pool config (www.conf, docker.conf).
[www]
; Answered by php-fpm itself, for the container health check.
ping.path = /ping

; Sized for a 2 GB host shared with Postgres, Redis and Next.js.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Keep the container environment visible to workers.
clear_env = no
